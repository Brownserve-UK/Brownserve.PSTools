---
name: validate-pr-label
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
    branches:
      - main

jobs:
  validate-changelog-label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: check-changelog-label
        uses: actions/github-script@v7
        with:
          script: |
            const COMMENT_MARKER = '<!-- changelog-label-check -->';

            const headRef = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;

            async function findBotComment() {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber
              });
              return comments.data.find(c => c.body.includes(COMMENT_MARKER));
            }

            async function upsertComment(body) {
              const existing = await findBotComment();
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body
                });
              }
            }

            async function deleteBotComment() {
              const existing = await findBotComment();
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id
                });
              }
            }

            if (headRef.startsWith('release/')) {
              core.info('Release branch PR - skipping label validation.');
              return;
            }

            const validLabels = ['bug', 'enhancement', 'documentation', 'cicd', 'maintenance'];
            const prLabels = context.payload.pull_request.labels.map(l => l.name);
            const hasValidLabel = prLabels.some(l => validLabels.includes(l));

            if (!hasValidLabel) {
              await upsertComment(
                `${COMMENT_MARKER}\n` +
                `:warning: **Changelog label missing**\n\n` +
                `This PR does not have a recognised changelog label. The \`label-pr\` workflow applies one automatically based on your PR title prefix.\n\n` +
                `Please update your PR title to begin with one of the following:\n\n` +
                `| Prefix | Examples |\n` +
                `|---|---|\n` +
                `| Features | \`[feat]:\` \`feat:\` \`[feature]:\` |\n` +
                `| Bug fixes | \`[fix]:\` \`fix:\` \`[bug]:\` |\n` +
                `| Docs | \`[docs]:\` \`docs:\` \`[doc]:\` |\n` +
                `| CI/CD | \`[ci]:\` \`ci:\` \`[cicd]:\` |\n` +
                `| Maintenance | \`[chore]:\` \`[refactor]:\` \`[ops]:\` \`[test]:\` \`[style]:\` |\n\n` +
                `Add \`!\` before the colon to flag a breaking change, e.g. \`[feat!]:\` or \`fix!:\``
              );
              core.setFailed('PR is missing a changelog label.');
            } else {
              await deleteBotComment();
            }
